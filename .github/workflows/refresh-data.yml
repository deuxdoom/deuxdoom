# Regenerates assets/generated/ (release badges + release insights) and the
# release tables in README.md / README.ko.md from public GitHub data, and commits
# only when the generated content actually changes.
#
# This file is self-contained: the project list and the generator script are
# embedded below and written to the runner's workspace at run time. Only
# assets/generated/ and the README text between <!-- releases:start --> and
# <!-- releases:end --> are ever changed.
#
# - Triggers: schedule and manual dispatch only (no push trigger, so the bot's
#   own commit can never start another run).
# - Auth: the built-in GITHUB_TOKEN, used read-only against public APIs and to
#   push the generated files back to this repository. No other secrets.
# - Failure: the generator makes every API request before writing anything and
#   exits non-zero on error, so committed files are never replaced with partial data.

name: Refresh profile data

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-profile-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write generator
        run: |
          mkdir -p scripts
          cat > scripts/projects.json <<'JSON'
          {
            "owner": "deuxdoom",
            "branch": "main",
            "releasing_since": "2013-02",
            "names": {
              "APEXGIFMAKER": "APEX GIF MAKER"
            },
            "projects": [
              {
                "no": "01",
                "repo": "TVerDownloader",
                "name": "TVer Downloader",
                "slug": "tver-downloader",
                "accent": "#65D6E6",
                "cover": ["docs/img/app-dark.png"]
              },
              {
                "no": "02",
                "repo": "ChzzkDownloader",
                "name": "ChzzkDownloader",
                "slug": "chzzk-downloader",
                "accent": "#47C9A2",
                "cover": ["docs/img/app-channel.png"]
              },
              {
                "no": "03",
                "repo": "PICVIUM",
                "name": "PICVIUM",
                "slug": "picvium",
                "accent": "#00C8FF",
                "cover": ["docs/assets/screens/viewer-photo.webp"]
              },
              {
                "no": "04",
                "repo": "FrameDoubler",
                "name": "FrameDoubler",
                "slug": "frame-doubler",
                "accent": "#FF6B3D",
                "cover": ["docs/img/screenshot-en.png"]
              },
              {
                "no": "05",
                "repo": "GamePadTester",
                "name": "GamePadTester",
                "slug": "gamepad-tester",
                "accent": "#5B9DF5",
                "cover": ["docs/images/overview.webp"]
              },
              {
                "no": "06",
                "repo": "SteamSlice",
                "name": "SteamSlice",
                "slug": "steam-slice",
                "accent": "#A78BFA",
                "cover": ["assets/main-window.png"]
              },
              {
                "no": "07",
                "repo": "Shadowplay-Notifier",
                "name": "ShadowPlay Notifier",
                "slug": "shadowplay-notifier",
                "accent": "#F2626B",
                "cover": ["assets/wallpaper.png"]
              },
              {
                "no": "08",
                "repo": "usage-monitor-for-claude",
                "name": "AI Agents Usage Monitor",
                "slug": "ai-agents-usage-monitor",
                "accent": "#F59E5B",
                "cover": ["assets/images/screenshot.png", "assets/images/screenshot2.png"]
              }
            ]
          }
          JSON
          cat > scripts/update_insights.py <<'PY'
          """Refresh the release badges and the release-insights graphic from public GitHub data.

          Runs on a schedule in .github/workflows/refresh-data.yml (which embeds a copy of
          this file and scripts/projects.json) and can be run locally:

              python scripts/update_insights.py

          Outputs (generated, do not edit by hand):
              assets/generated/release-<slug>.svg   latest stable release + date (featured project cards)
              assets/generated/releases/<slug>.svg  release card for the 06 grid, one per listed repository
              assets/generated/insights.svg         totals and monthly release activity (featured projects)
              README.md, README.ko.md               only the release grid between the
                                                    <!-- releases:start --> / <!-- releases:end --> markers

          The release grid lists the featured projects plus every other public, non-fork
          repository of the owner that has at least one published release, newest
          release first (by the date shown on its card). Cards are 276 px wide so they
          wrap into 3 columns on desktop and 1 on phones without being scaled down.
          Generated files of repositories that drop out of the grid are removed.

          Only the public GitHub REST API is used. GITHUB_TOKEN is optional and only
          raises the rate limit. Every request is made before any file is written: if a
          request fails, the script exits non-zero and the committed files stay as they
          are. Files are rewritten only when their data actually changed.
          """

          from __future__ import annotations

          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path
          from xml.sax.saxutils import escape

          ROOT = Path(__file__).resolve().parent.parent
          CONFIG = ROOT / "scripts" / "projects.json"
          OUT_DIR = ROOT / "assets" / "generated"
          API = "https://api.github.com"

          SANS = "'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          MONO = "'Cascadia Mono', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace"
          MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]


          # --------------------------------------------------------------------------- data

          def request(url: str) -> tuple[object, dict]:
              headers = {
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "deuxdoom-profile-insights",
              }
              token = os.environ.get("GITHUB_TOKEN")
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  return json.load(response), dict(response.headers)


          def request_all(url: str) -> list:
              items: list = []
              while url:
                  data, headers = request(url)
                  items.extend(data)  # type: ignore[arg-type]
                  match = re.search(r'<([^>]+)>;\s*rel="next"', headers.get("Link", ""))
                  url = match.group(1) if match else ""
              return items


          def latest_stable(owner: str, repo: str) -> dict | None:
              """GitHub's own notion of "latest": newest non-draft, non-prerelease release."""
              try:
                  data, _ = request(f"{API}/repos/{owner}/{repo}/releases/latest")
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  raise
              return data  # type: ignore[return-value]


          def parse_time(value: str) -> datetime:
              return datetime.strptime(value, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)


          def release_data(owner: str, repo: str) -> dict:
              releases = [
                  r for r in request_all(f"{API}/repos/{owner}/{repo}/releases?per_page=100")
                  if not r.get("draft") and r.get("published_at")
              ]
              stable = latest_stable(owner, repo) if releases else None
              newer_pre = None
              pres = sorted((r for r in releases if r.get("prerelease")), key=lambda r: r["published_at"], reverse=True)
              if pres and (stable is None or pres[0]["published_at"] > stable["published_at"]):
                  newer_pre = pres[0]
              return {
                  "releases": [
                      {
                          "tag": r["tag_name"],
                          "published": parse_time(r["published_at"]),
                          "downloads": sum(a.get("download_count", 0) for a in r.get("assets", [])),
                      }
                      for r in releases
                  ],
                  "stable": {"tag": stable["tag_name"], "published": parse_time(stable["published_at"])} if stable else None,
                  "pre": {"tag": newer_pre["tag_name"], "published": parse_time(newer_pre["published_at"])} if newer_pre else None,
              }


          def slugify(repo: str) -> str:
              """VideoBatchConverter -> video-batch-converter, PARANORMASIGHT-KR-Patch -> paranormasight-kr-patch."""
              words = re.sub(r"(?<=[a-z0-9])(?=[A-Z])", "-", repo).lower()
              return re.sub(r"[^a-z0-9]+", "-", words).strip("-")


          def collect(config: dict) -> tuple[list[dict], list[dict]]:
              """Featured projects (fixed order) and the owner's other released repositories."""
              owner = config["owner"]
              featured = [{**project, **release_data(owner, project["repo"])} for project in config["projects"]]

              known = {p["repo"].lower() for p in featured}
              names = config.get("names", {})
              others = []
              for repo in request_all(f"{API}/users/{owner}/repos?type=owner&per_page=100"):
                  name = repo["name"]
                  if repo.get("private") or repo.get("fork") or name.lower() in known or name.lower() == owner.lower():
                      continue
                  data = release_data(owner, name)
                  if data["releases"]:
                      others.append({"repo": name, "name": names.get(name, name), "slug": slugify(name), **data})
              slugs = [p["slug"] for p in featured + others]
              if len(slugs) != len(set(slugs)):
                  raise ValueError(f"duplicate badge slugs: {sorted(slugs)}")
              return featured, others


          def shown_date(project: dict) -> datetime | None:
              """The date the badge shows (stable release), or the newest release when there is no stable one."""
              if project["stable"]:
                  return project["stable"]["published"]
              return max((r["published"] for r in project["releases"]), default=None)


          def by_update(projects: list[dict]) -> list[dict]:
              ordered = sorted(projects, key=lambda p: p["name"].lower())
              ordered.sort(key=lambda p: shown_date(p) or datetime.min.replace(tzinfo=timezone.utc), reverse=True)
              return ordered


          # --------------------------------------------------------------------------- helpers

          def version(tag: str) -> str:
              return f"v{tag}" if tag[:1].isdigit() else tag


          def compact(n: int) -> str:
              if n < 1000:
                  return f"{n:,}"
              if n < 100_000:
                  return f"{n / 1000:.1f}k".replace(".0k", "k")
              return f"{round(n / 1000):,}k"


          def text_width(text: str, size: float) -> float:
              """Generous width estimate for monospace text (covers Consolas, Menlo, DejaVu)."""
              return len(text) * size * 0.61


          def fit(text: str, size: float, max_width: float) -> str:
              """textLength attributes that squeeze proportional text only when it may overflow."""
              estimate = len(text) * size * 0.56
              if estimate <= max_width:
                  return ""
              return f' textLength="{max_width:.0f}" lengthAdjust="spacingAndGlyphs"'


          def month_key(dt: datetime) -> tuple[int, int]:
              return dt.year, dt.month


          def last_months(now: datetime, count: int = 12) -> list[tuple[int, int]]:
              year, month = now.year, now.month
              keys = []
              for _ in range(count):
                  keys.append((year, month))
                  month -= 1
                  if month == 0:
                      year, month = year - 1, 12
              return list(reversed(keys))


          # --------------------------------------------------------------------------- release badge

          def release_badge(project: dict) -> str:
              stable, pre = project["stable"], project["pre"]
              h, size, pad = 24, 12, 10
              segments: list[tuple[str, str, str, bool]] = []  # text, fill, text colour, leading dot
              if stable:
                  segments.append((version(stable["tag"]), "#1D2A45", "#F0F4FA", True))
                  segments.append((stable["published"].strftime("%Y-%m-%d"), "#131C33", "#B9C8DF", False))
                  title = f"{project['name']}: latest stable release {version(stable['tag'])}, published {stable['published']:%Y-%m-%d} (UTC)"
              else:
                  segments.append(("No published release", "#131C33", "#8193B5", False))
                  title = f"{project['name']}: no published stable release"
              if pre:
                  segments.append((f"pre-release {version(pre['tag'])}", "#241B3D", "#C8B8FF", False))
                  title += f"; newer pre-release {version(pre['tag'])}"

              parts, x = [], 0.0
              for text, fill, colour, dot in segments:
                  inner = text_width(text, size) + (14 if dot else 0)
                  w = round(inner + pad * 2)
                  parts.append(f'<rect x="{x:g}" width="{w}" height="{h}" fill="{fill}"/>')
                  tx = x + pad
                  if dot:
                      parts.append(f'<circle cx="{tx + 4:g}" cy="12" r="4" fill="#47C9A2"/>')
                      tx += 14
                  weight = ' font-weight="700"' if dot else ""
                  parts.append(f'<text x="{tx:g}" y="16.5" fill="{colour}"{weight}>{escape(text)}</text>')
                  x += w
              width = round(x)
              return f"""<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{h}" viewBox="0 0 {width} {h}" role="img" aria-label="{escape(title)}">
            <title>{escape(title)}</title>
            <clipPath id="r"><rect width="{width}" height="{h}" rx="6"/></clipPath>
            <g clip-path="url(#r)" font-family="{MONO}" font-size="{size}">
              {chr(10).join('    ' + p for p in parts).strip()}
            </g>
            <rect x=".5" y=".5" width="{width - 1}" height="{h - 1}" rx="5.5" fill="none" stroke="#2E3F63"/>
          </svg>
          """


          # --------------------------------------------------------------------------- release card (06 grid)

          CARD_W, CARD_H = 276, 64   # 3 per row in the 846 px desktop README, 1 per row at phone width (308 px)
          CARD_SANS = "'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          CARD_NEUTRAL = "#5D6F93"   # accent bar of repositories that are not featured


          def release_card(project: dict) -> str:
              stable, pre, no = project["stable"], project["pre"], project.get("no")
              accent = project.get("accent", CARD_NEUTRAL)
              parts: list[str] = []

              # top right: a newer pre-release wins over the featured number
              tag_w = 0.0
              if pre:
                  tag = f"pre {version(pre['tag'])}"
                  tag_w = min(text_width(tag, 11), 120)
                  squeeze = f' textLength="{tag_w:.0f}" lengthAdjust="spacingAndGlyphs"' if text_width(tag, 11) > 120 else ""
                  parts.append(f'<text x="{CARD_W - 14}" y="26" text-anchor="end" font-family="{MONO}" font-size="11" fill="#C8B8FF"{squeeze}>{escape(tag)}</text>')
              elif no:
                  tag_w = text_width(no, 12)
                  parts.append(f'<text x="{CARD_W - 14}" y="26" text-anchor="end" font-family="{MONO}" font-size="12" font-weight="700" fill="{accent}">{escape(no)}</text>')

              name_max = CARD_W - 20 - 14 - (tag_w + 10 if tag_w else 0)
              squeeze = f' textLength="{name_max:.0f}" lengthAdjust="spacingAndGlyphs"' if len(project["name"]) * 15 * 0.58 > name_max else ""
              parts.append(f'<text x="20" y="27" font-family="{CARD_SANS}" font-size="15" font-weight="600" fill="#F0F4FA"{squeeze}>{escape(project["name"])}</text>')

              if stable:
                  tag = version(stable["tag"])
                  pill_w = round(text_width(tag, 12) + 26)
                  parts.append(f'<rect x="20" y="36" width="{pill_w}" height="20" rx="5" fill="#1D2A45" stroke="#2E3F63"/>')
                  parts.append(f'<circle cx="29" cy="46" r="3.5" fill="#47C9A2"/>')
                  parts.append(f'<text x="37" y="50.2" font-family="{MONO}" font-size="12" font-weight="700" fill="#F0F4FA">{escape(tag)}</text>')
                  parts.append(f'<text x="{20 + pill_w + 10}" y="50.2" font-family="{MONO}" font-size="12" fill="#B9C8DF">{stable["published"]:%Y-%m-%d}</text>')
                  title = f"{project['name']}: latest stable release {tag}, published {stable['published']:%Y-%m-%d} (UTC)"
              else:
                  parts.append(f'<text x="20" y="50.2" font-family="{MONO}" font-size="12" fill="#8193B5">No stable release</text>')
                  title = f"{project['name']}: no published stable release"
              if pre:
                  title += f"; newer pre-release {version(pre['tag'])}"

              return f"""<svg xmlns="http://www.w3.org/2000/svg" width="{CARD_W}" height="{CARD_H}" viewBox="0 0 {CARD_W} {CARD_H}" role="img" aria-label="{escape(title)}">
            <title>{escape(title)}</title>
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#0B1020"/>
                <stop offset="1" stop-color="#0F1832"/>
              </linearGradient>
            </defs>
            <rect x=".75" y=".75" width="{CARD_W - 1.5}" height="{CARD_H - 1.5}" rx="10" fill="url(#bg)" stroke="#263451" stroke-width="1.5"/>
            <rect x="8" y="14" width="3" height="{CARD_H - 28}" rx="1.5" fill="{accent}"/>
            {chr(10).join('  ' + p for p in parts).strip()}
          </svg>
          """


          # --------------------------------------------------------------------------- insights graphic

          def insights(projects: list[dict], now: datetime, as_of: str, since: datetime | None = None) -> str:
              W, H = 760, 520
              all_releases = [(p, r) for p in projects for r in p["releases"]]
              total_releases = len(all_releases)
              total_downloads = sum(r["downloads"] for _, r in all_releases)
              # "Shipping since" also counts earlier work that is no longer public (config "releasing_since").
              first = min([r["published"] for _, r in all_releases] + ([since] if since else []), default=None)
              latest_p, latest_r = max(all_releases, key=lambda pr: pr[1]["published"], default=(None, None))

              tiles = [
                  (str(total_releases), "Releases published", f"across {len(projects)} apps"),
                  (compact(total_downloads), "Release downloads", "GitHub Release assets"),
                  (f"{MONTHS[first.month - 1]} {first.year}" if first else "—", "Shipping since", "first public release"),
                  (
                      f"{MONTHS[latest_r['published'].month - 1]} {latest_r['published'].day}" if latest_r else "—",
                      "Latest release",
                      f"{latest_p['name']} {version(latest_r['tag'])}" if latest_r else "",
                  ),
              ]

              out: list[str] = []
              add = out.append
              add(f'<rect x=".75" y=".75" width="{W - 1.5}" height="{H - 1.5}" rx="18" fill="#0B1020" stroke="#263451" stroke-width="1.5"/>')
              add(f'<rect x="32" y="31" width="9" height="9" fill="#65D6E6"/>')
              add(f'<text x="50" y="40" font-family="{MONO}" font-size="15" letter-spacing="3" fill="#65D6E6">RELEASE INSIGHTS</text>')
              add(f'<text x="{W - 32}" y="40" text-anchor="end" font-family="{MONO}" font-size="13" fill="#7D8FB3" data-as-of="{as_of}">Data as of {as_of} UTC</text>')

              gap, top, tile_h = 12, 62, 104
              tile_w = (W - 64 - gap * 3) / 4
              for i, (value, label, sub) in enumerate(tiles):
                  x = 32 + i * (tile_w + gap)
                  add(f'<rect x="{x:.1f}" y="{top}" width="{tile_w:.1f}" height="{tile_h}" rx="12" fill="#121B33" stroke="#22304D"/>')
                  add(f'<text x="{x + 16:.1f}" y="{top + 44}" font-family="{SANS}" font-size="30" font-weight="700" fill="#F0F4FA">{escape(value)}</text>')
                  add(f'<text x="{x + 16:.1f}" y="{top + 71}" font-family="{SANS}" font-size="15" fill="#B9C8DF"{fit(label, 15, tile_w - 28)}>{escape(label)}</text>')
                  add(f'<text x="{x + 16:.1f}" y="{top + 91}" font-family="{SANS}" font-size="13" fill="#7D8FB3"{fit(sub, 13, tile_w - 28)}>{escape(sub)}</text>')

              # monthly stacked bars
              months = last_months(now)
              counts: dict[tuple[int, int], list[int]] = defaultdict(lambda: [0] * len(projects))
              for i, p in enumerate(projects):
                  for r in p["releases"]:
                      counts[month_key(r["published"])][i] += 1
              totals = [sum(counts[m]) for m in months]
              peak = max(totals + [1])
              step = 5 if peak <= 25 else 10
              ceiling = -(-peak // step) * step

              add(f'<text x="32" y="210" font-family="{SANS}" font-size="16" font-weight="600" fill="#F0F4FA">Releases per month</text>')
              add(f'<text x="{W - 32}" y="210" text-anchor="end" font-family="{SANS}" font-size="13" fill="#7D8FB3">last 12 months · stacked by project</text>')
              cx0, cx1, cy0, cy1 = 64, W - 32, 236, 380
              for g in range(3):
                  value = ceiling * g // 2
                  y = cy1 - (cy1 - cy0) * g / 2
                  add(f'<path d="M{cx0} {y:.1f}H{cx1}" stroke="#1E2A45" stroke-width="1"/>')
                  add(f'<text x="{cx0 - 10}" y="{y + 4:.1f}" text-anchor="end" font-family="{MONO}" font-size="13" fill="#7D8FB3">{value}</text>')
              slot = (cx1 - cx0) / len(months)
              bar_w = min(30, slot * 0.6)
              for k, m in enumerate(months):
                  bx = cx0 + slot * k + (slot - bar_w) / 2
                  y = cy1
                  for i, p in enumerate(projects):
                      n = counts[m][i]
                      if not n:
                          continue
                      h = (cy1 - cy0) * n / ceiling
                      y -= h
                      add(f'<rect x="{bx:.1f}" y="{y:.1f}" width="{bar_w:.1f}" height="{h:.1f}" fill="{p["accent"]}"/>')
                  if totals[k]:
                      add(f'<text x="{bx + bar_w / 2:.1f}" y="{y - 7:.1f}" text-anchor="middle" font-family="{MONO}" font-size="13" fill="#B9C8DF">{totals[k]}</text>')
                  label = MONTHS[m[1] - 1]
                  add(f'<text x="{bx + bar_w / 2:.1f}" y="{cy1 + 20}" text-anchor="middle" font-family="{MONO}" font-size="13" fill="#7D8FB3">{label}</text>')
                  if k == 0 or m[1] == 1:
                      add(f'<text x="{bx + bar_w / 2:.1f}" y="{cy1 + 35}" text-anchor="middle" font-family="{MONO}" font-size="12" fill="#5D6F93">{m[0]}</text>')

              # legend
              col_w = (W - 64) / 4
              for i, p in enumerate(projects):
                  lx = 32 + col_w * (i % 4)
                  ly = 444 + 24 * (i // 4)
                  add(f'<rect x="{lx:.1f}" y="{ly - 10}" width="10" height="10" rx="2" fill="{p["accent"]}"/>')
                  add(f'<text x="{lx + 18:.1f}" y="{ly}" font-family="{SANS}" font-size="14" fill="#B9C8DF"{fit(p["no"] + " " + p["name"], 14, col_w - 30)}><tspan font-family="{MONO}" fill="#7D8FB3">{p["no"]}</tspan> {escape(p["name"])}</text>')

              add(f'<text x="32" y="{H - 22}" font-family="{MONO}" font-size="12" fill="#5D6F93">Source: public GitHub REST API · drafts excluded · refreshed by GitHub Actions</text>')

              summary = (
                  f"Release insights: {total_releases} releases across {len(projects)} apps, "
                  f"{total_downloads:,} release downloads, data as of {as_of} UTC"
              )
              return f"""<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" role="img" aria-label="{escape(summary)}">
            <title>{escape(summary)}</title>
            {chr(10).join('  ' + line for line in out).strip()}
          </svg>
          """


          # --------------------------------------------------------------------------- README release grid

          GRID_START, GRID_END = "<!-- releases:start -->", "<!-- releases:end -->"
          # alt text per README: (stable release, no stable release)
          GRIDS = {
              "README.md": ("{name}: latest release {tag}, {date} (UTC)", "{name}: no stable release yet"),
              "README.ko.md": ("{name}: 최신 정식 릴리스 {tag}, {date}(UTC)", "{name}: 정식 릴리스 없음"),
          }


          def release_grid(projects: list[dict], owner: str, alts: tuple[str, str]) -> str:
              """One linked card per repository; the cards wrap into 3, 2 or 1 per row with the page width."""
              lines = []
              for p in projects:
                  url = f"https://github.com/{owner}/{p['repo']}"
                  if p["stable"]:
                      target = f"{url}/releases/latest"
                      alt = alts[0].format(name=p["name"], tag=version(p["stable"]["tag"]), date=f"{p['stable']['published']:%Y-%m-%d}")
                  else:
                      target, alt = f"{url}/releases", alts[1].format(name=p["name"])
                  lines.append(
                      f'<a href="{target}"><img src="assets/generated/releases/{p["slug"]}.svg" '
                      f'width="{CARD_W}" alt="{escape(alt, {chr(34): "&quot;"})}"></a>'
                  )
              return "\n".join(lines)


          def with_grid(document: str, grid: str) -> str:
              start, end = document.find(GRID_START), document.find(GRID_END)
              if start < 0 or end < start:
                  raise ValueError(f"release grid markers {GRID_START} / {GRID_END} not found")
              return f"{document[:start + len(GRID_START)]}\n\n{grid}\n\n{document[end:]}"


          # --------------------------------------------------------------------------- output

          def write_if_changed(path: Path, content: str) -> bool:
              if path.exists() and path.read_text(encoding="utf-8") == content:
                  return False
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix(path.suffix + ".tmp")
              tmp.write_text(content, encoding="utf-8", newline="\n")
              tmp.replace(path)
              return True


          def main() -> int:
              config = json.loads(CONFIG.read_text(encoding="utf-8"))
              try:
                  featured, others = collect(config)
              except (urllib.error.URLError, TimeoutError, ValueError, KeyError) as error:
                  print(f"error: GitHub API request failed, keeping existing files: {error}", file=sys.stderr)
                  return 1

              now = datetime.now(timezone.utc)
              listed = by_update(featured + others)
              outputs: dict[Path, str] = {}
              for project in featured:  # badges on the featured cards
                  outputs[OUT_DIR / f"release-{project['slug']}.svg"] = release_badge(project)
              for project in listed:    # cards in the 06 grid
                  outputs[OUT_DIR / "releases" / f"{project['slug']}.svg"] = release_card(project)
              stale = sorted(
                  path for path in [*OUT_DIR.glob("release-*.svg"), *OUT_DIR.glob("releases/*.svg")]
                  if path not in outputs
              )

              try:
                  for name, alts in GRIDS.items():
                      path = ROOT / name
                      outputs[path] = with_grid(path.read_text(encoding="utf-8"), release_grid(listed, config["owner"], alts))
              except (OSError, ValueError) as error:
                  print(f"error: cannot update the README release grids, keeping existing files: {error}", file=sys.stderr)
                  return 1

              # Keep the previous "as of" date unless the data itself changed, so an
              # unchanged graphic does not produce a commit every run.
              since = config.get("releasing_since")
              since_dt = datetime.strptime(since, "%Y-%m").replace(tzinfo=timezone.utc) if since else None
              insights_path = OUT_DIR / "insights.svg"
              today = now.strftime("%Y-%m-%d")
              previous = insights_path.read_text(encoding="utf-8") if insights_path.exists() else ""
              match = re.search(r'data-as-of="([0-9-]+)"', previous)
              if match and insights(featured, now, match.group(1), since_dt) == previous:
                  outputs[insights_path] = previous
              else:
                  outputs[insights_path] = insights(featured, now, today, since_dt)

              changed = [path for path, content in outputs.items() if write_if_changed(path, content)]
              for path in stale:
                  path.unlink()
                  changed.append(path)
              for path in changed:
                  print(f"{'removed' if path in stale else 'updated'} {path.relative_to(ROOT).as_posix()}")
              if not changed:
                  print("no changes")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY

      - name: Generate release badges, tables and insights
        run: python3 scripts/update_insights.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- assets/generated README.md README.ko.md)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- assets/generated README.md README.ko.md
          git commit -m "chore: refresh release data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

# Regenerates assets/generated/ (release badges + release insights) from public
# GitHub data. Commits only when the generated files actually change.
#
# - Triggers: schedule and manual dispatch only (no push trigger, so the bot's
#   own commit can never start another run).
# - Auth: the built-in GITHUB_TOKEN, used read-only against public APIs and to
#   push the generated files back to this repository. No other secrets.
# - Failure: scripts/update_insights.py makes every API request before writing
#   anything and exits non-zero on error, so committed files are never replaced
#   with partial data.

name: Refresh profile data

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-profile-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate release badges and insights
        run: python3 scripts/update_insights.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- assets/generated)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          git commit -m "chore: refresh release data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

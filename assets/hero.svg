
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320" viewBox="0 0 1200 320"
     role="img" aria-label="DEUXDOOM Developer Portfolio">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#172440"/>
      <stop offset="100%" stop-color="#131D35"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#65D6E6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            fill="none" stroke="#FFFFFF"
            stroke-opacity=".055" stroke-width="1"/>
    </pattern>

    <clipPath id="rounded">
      <rect width="1200" height="320" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="320" fill="url(#background)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- Geometric illustration -->
    <circle cx="1020" cy="155" r="164"
            fill="none" stroke="#65D6E6"
            stroke-opacity=".15" stroke-width="1.5"/>
    <circle cx="1020" cy="155" r="120"
            fill="none" stroke="#A78BFA"
            stroke-opacity=".20" stroke-width="1.5"/>
    <circle cx="1020" cy="155" r="74"
            fill="none" stroke="#65D6E6"
            stroke-opacity=".35" stroke-width="2"/>

    <path d="M952 155H1088M1020 87V223"
          stroke="#65D6E6" stroke-opacity=".4"/>
    <circle cx="1020" cy="155" r="9" fill="#65D6E6"/>

    <!-- Brand label -->
    <rect x="54" y="50" width="5" height="22"
          rx="2" fill="#65D6E6"/>

    <text x="74" y="67" fill="#65D6E6"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="16" font-weight="600"
          letter-spacing="3">
      INDEPENDENT SOFTWARE PROJECTS
    </text>

    <!-- Main title -->
    <text x="54" y="158" fill="#F0F4FA"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="80" font-weight="750"
          letter-spacing="-2">
      DEUXDOOM
    </text>

    <text x="58" y="201" fill="#B9C8DF"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="24">
      Practical software. Thoughtful details.
    </text>

    <!-- Accent line -->
    <rect x="58" y="224" width="520"
          height="2" fill="url(#accent)" opacity=".65"/>

    <!-- Expertise -->
    <g font-family="Segoe UI, Arial, sans-serif"
       font-size="15" font-weight="600">

      <rect x="58" y="245" width="116" height="35"
            rx="9" fill="#263451"/>
      <text x="79" y="268" fill="#65D6E6">WINDOWS</text>

      <rect x="185" y="245" width="112" height="35"
            rx="9" fill="#263451"/>
      <text x="206" y="268" fill="#C5B3FF">AI TOOLS</text>

      <rect x="308" y="245" width="112" height="35"
            rx="9" fill="#263451"/>
      <text x="329" y="268" fill="#E0E8F5">MEDIA</text>

      <rect x="431" y="245" width="115" height="35"
            rx="9" fill="#263451"/>
      <text x="450" y="268" fill="#E0E8F5">GAMING</text>
    </g>
  </g>
</svg>
  

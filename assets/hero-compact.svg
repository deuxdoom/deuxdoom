<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="hero-c-title hero-c-desc">
  <title id="hero-c-title">DEUXDOOM — Independent Software Engineering</title>
  <desc id="hero-c-desc">Desktop Applications / Automation / Developer Utilities. Practical software. Thoughtful engineering.</desc>
  <style>
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "Cascadia Mono", Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace; }
    .anim { transform-box: view-box; }
    .orbit { transform-origin: 610px 120px; animation: spin 120s linear infinite; }
    .pulse { animation: pulse 4.8s ease-in-out infinite; }
    .pulse.d2 { animation-delay: 1.6s; }
    .pulse.d3 { animation-delay: 3.2s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <clipPath id="c-frame"><rect width="720" height="460" rx="24"/></clipPath>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#0F1832"/>
    </linearGradient>
    <radialGradient id="c-glow-cyan" cx="640" cy="40" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#65D6E6" stop-opacity=".20"/>
      <stop offset="1" stop-color="#65D6E6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c-glow-violet" cx="60" cy="500" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".16"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="c-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#263451" stroke-width="1"/>
    </pattern>
    <linearGradient id="c-grid-fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".7"/>
    </linearGradient>
    <mask id="c-grid-mask"><rect width="720" height="460" fill="url(#c-grid-fade)"/></mask>
    <linearGradient id="c-title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D3DFF2"/>
    </linearGradient>
    <linearGradient id="c-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65D6E6"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#c-frame)">
    <rect width="720" height="460" fill="url(#c-bg)"/>
    <rect width="720" height="460" fill="url(#c-grid)" mask="url(#c-grid-mask)" opacity=".7"/>
    <rect width="720" height="460" fill="url(#c-glow-cyan)"/>
    <rect width="720" height="460" fill="url(#c-glow-violet)"/>

    <circle cx="610" cy="120" r="70" fill="none" stroke="#2E3F63"/>
    <circle class="anim orbit" cx="610" cy="120" r="104" fill="none" stroke="#65D6E6" stroke-opacity=".35" stroke-width="1.2" stroke-dasharray="2 10"/>
    <g fill="#0B1020" stroke-width="1.6">
      <circle class="pulse" cx="610" cy="16" r="5" stroke="#A78BFA"/>
      <circle class="pulse d2" cx="707" cy="156" r="5" stroke="#65D6E6"/>
      <circle class="pulse d3" cx="512" cy="84" r="5" stroke="#65D6E6"/>
    </g>

    <g fill="none" stroke="#65D6E6" stroke-opacity=".7" stroke-width="1.5">
      <path d="M28 44V28H44"/>
      <path d="M692 416V432H676"/>
    </g>

    <rect x="48" y="78" width="12" height="12" fill="#65D6E6"/>
    <text class="mono" x="72" y="90" font-size="19" letter-spacing="3" fill="#65D6E6">INDEPENDENT SOFTWARE</text>
    <text class="mono" x="72" y="118" font-size="19" letter-spacing="3" fill="#65D6E6">ENGINEERING</text>
    <text class="sans" x="42" y="214" font-size="100" font-weight="800" letter-spacing="4" fill="url(#c-title)">DEUXDOOM</text>
    <rect x="48" y="242" width="72" height="3" rx="1.5" fill="url(#c-rule)"/>
    <rect x="128" y="243" width="300" height="1" fill="#263451"/>

    <g class="sans" font-size="28" font-weight="500" fill="#B9C8DF">
      <rect x="48" y="276" width="9" height="9" fill="#65D6E6"/>
      <text x="70" y="288">Desktop Applications</text>
      <rect x="48" y="318" width="9" height="9" fill="#A78BFA"/>
      <text x="70" y="330">Automation</text>
      <rect x="48" y="360" width="9" height="9" fill="#65D6E6"/>
      <text x="70" y="372">Developer Utilities</text>
    </g>
    <text class="sans" x="48" y="420" font-size="24" fill="#F0F4FA">Practical software.<tspan fill="#C8B8FF" dx="8">Thoughtful engineering.</tspan></text>
  </g>
  <rect x=".75" y=".75" width="718.5" height="458.5" rx="23.5" fill="none" stroke="#263451" stroke-width="1.5"/>
</svg>
